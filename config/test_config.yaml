# Training Configuration - Quick Test
# This config is for quick testing with limited samples

# Data paths
data:
  csv_path: "data/chess.csv"
  output_path: "models/test_model.pkl"

# Training parameters
training:
  max_samples: 1000        # Limit samples for quick testing
  epochs: 1                # Single epoch for testing
  batch_size: 32
  learning_rate: 0.01

# Model architecture
model:
  input_size: 1260
  hidden_size: 256

# Loss function
loss:
  type: "mse"              # Options: mse, huber, scaled_mse

# Validation
validation:
  ratio: 0.1               # 10% for validation

# Checkpointing
checkpointing:
  enabled: false           # Disable for quick tests
  directory: "models/checkpoints"

# Logging
logging:
  level: "INFO"            # Options: DEBUG, INFO, WARNING, ERROR
  log_dir: "logs/training"
